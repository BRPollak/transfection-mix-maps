[project]
name = "transfection-mix-map"
version = "0.3"
description = "Local plate mix maps adapted from Optimized Transfection Mix Maps.ipynb"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.45,<2",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "gspread>=6.1,<7",
  "google-auth-oauthlib>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
